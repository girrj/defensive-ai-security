title: PowerShell With Encoded Command and Hidden Window or Download
id: a8cbfad7-69bb-4eef-90c5-9cc2a0344a0e
status: experimental
description: |
  Detects PowerShell started with an encoded command together with a hidden
  window, no profile, or execution-policy bypass, or with an in-line download
  cradle. Malware loaders and hands-on-keyboard intrusions both use this
  combination. Admin tooling usually doesn't need to hide its window.
author: girrj
date: 2026-11-14
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense-evasion
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_encoded:
    CommandLine|re: '(?i)\s-(e|en|enc|enco|encod|encode|encodedcommand)\s+[A-Za-z0-9+/=]{40,}'
  selection_stealth:
    CommandLine|re: '(?i)\s-(w|wi|win|window|windowstyle)\s+(h|hi|hid|hidd|hidde|hidden)\b|\s-(nop|noprofile)\b|\s-(ep|exec|executionpolicy)\s+bypass'
  selection_cradle:
    CommandLine|re: '(?i)(iex|invoke-expression).{0,40}(new-object\s+net\.webclient|downloadstring|invoke-webrequest|iwr|irm|invoke-restmethod)|(downloadstring|downloadfile)\s*\(\s*[''"]https?://'
  condition: selection_img and ((selection_encoded and selection_stealth) or selection_cradle)
falsepositives:
  - Some endpoint management and monitoring agents run encoded, hidden PowerShell. Exclude by the parent image and the signer of the agent.
level: high
