title: AI Coding Agent Shell Modifies Microsoft Defender Settings
id: b0cc1ee7-b579-41c4-a21d-8833e5d6cce0
status: experimental
description: |
  Detects a shell started by an AI coding agent that disables Microsoft Defender
  protections or adds exclusions. Agents sometimes try to "fix" a build that
  antivirus has blocked by weakening the endpoint, and an injected instruction
  can request the same change on purpose.
author: girrj
date: 2026-11-14
tags:
  - attack.defense-evasion
  - attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - '\claude.exe'
      - '\codex.exe'
  selection_mppref:
    CommandLine|contains:
      - 'Set-MpPreference'
      - 'Add-MpPreference'
  selection_mppref_args:
    CommandLine|contains:
      - 'DisableRealtimeMonitoring'
      - 'DisableBehaviorMonitoring'
      - 'DisableIOAVProtection'
      - 'DisableScriptScanning'
      - 'ExclusionPath'
      - 'ExclusionProcess'
      - 'ExclusionExtension'
  selection_reg:
    CommandLine|contains|all:
      - 'reg'
      - 'Windows Defender'
      - 'DisableAntiSpyware'
  condition: selection_parent and ((selection_mppref and selection_mppref_args) or selection_reg)
falsepositives:
  - Rare. Defender exclusions for development folders should be managed centrally, not by an agent.
level: high
