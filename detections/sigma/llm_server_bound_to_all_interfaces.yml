title: Local LLM Inference Server Started Listening on All Interfaces
id: 97c81b52-b0e2-4cb9-aaca-2ed76400a6b0
status: experimental
description: |
  Detects local model servers (llama.cpp server, vLLM, text-generation-webui,
  LM Studio, LocalAI, Ollama via its CLI flag) started so they listen on every
  network interface. Most of these servers have no authentication by default.
  Exposed ones are found by internet-wide scans within hours and abused for
  free inference, model theft, or model tampering. Pair this rule with the
  Suricata rules 9100100-9100105, which detect the resulting external access.
author: girrj
date: 2026-11-14
tags:
  - attack.initial-access
  - attack.t1133
  - attack.t1190
logsource:
  category: process_creation
detection:
  selection_server:
    - Image|endswith:
        - '/llama-server'
        - '\llama-server.exe'
        - '/local-ai'
        - '\local-ai.exe'
    - CommandLine|contains:
        - 'vllm serve'
        - 'vllm.entrypoints'
        - 'text-generation-webui'
        - 'server.py --listen'
        - 'lms server start'
        - 'llama_cpp.server'
  selection_all_interfaces:
    CommandLine|contains:
      - '--host 0.0.0.0'
      - '--host=0.0.0.0'
      - '--host ::'
      - '--listen'
      - '--bind 0.0.0.0'
      - '--cors'
  condition: all of selection_*
falsepositives:
  - Dedicated inference hosts that sit behind an authenticating reverse proxy and a firewall. Exclude them by hostname after you verify the proxy really is in front.
  - Container entrypoints, where 0.0.0.0 is needed inside the container network. Check that the published port is bound to localhost or a private interface only.
level: medium
