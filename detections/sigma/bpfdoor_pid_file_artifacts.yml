title: BPFDoor Pid or Staging File Created (Linux)
id: 0b7c9f61-3d2a-4e8b-9a51-6f2e8d4c1a07
status: experimental
description: |
  Detects creation of pid and staging files that public analyses of the
  BPFDoor backdoor list. Older builds copy themselves to /dev/shm/kdmtmpflush
  and write /var/run/haldrund.pid. The 2025 variants found in Korean telecom
  intrusions used pid names that imitate hardware and HAL daemons. Most of
  these names do not belong to any package, so a hit warrants triage of the
  writing process and its open raw sockets.
references:
  - https://asec.ahnlab.com/en/87863/
  - https://www.trendmicro.com/en_us/research/25/d/bpfdoor-hidden-controller.html
author: girrj
date: 2026-11-14
tags:
  - attack.defense-evasion
  - attack.t1036.005
  - attack.persistence
  - attack.t1205.002
logsource:
  category: file_event
  product: linux
detection:
  selection_pid:
    TargetFilename|endswith:
      - '/run/haldrund.pid'
      - '/run/hald-smartd.pid'
      - '/run/hp-health.pid'
      - '/run/hald-addon.pid'
      - '/run/system.pid'
  selection_staging:
    TargetFilename: '/dev/shm/kdmtmpflush'
  condition: 1 of selection_*
falsepositives:
  - HP hardware health agents on old ProLiant hosts may write a pid with a similar name. Confirm the writing binary is the vendor package (rpm -qf / dpkg -S).
  - /run/system.pid is generic. If it fires on a known service, add that Image as a filter.
level: high
