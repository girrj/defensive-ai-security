title: AI Coding Agent Shell Reads Credential Material
id: 7daaafff-e903-4205-ab82-5ded4aa0f156
status: experimental
description: |
  Detects a shell started by an AI coding agent whose command line references
  common credential stores: cloud CLI credentials, SSH private keys, browser
  credential databases, or .env files. Prompt-injected agents are a realistic
  route to credential theft, because the agent already has file access and
  often has network access too.
author: girrj
date: 2026-11-14
tags:
  - attack.credential-access
  - attack.t1552.001
  - attack.t1552.004
  - attack.t1555.003
logsource:
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
      - '\claude.exe'
      - '\codex.exe'
      - '/claude'
      - '/codex'
  selection_target:
    CommandLine|contains:
      - '.aws\credentials'
      - '.aws/credentials'
      - '.azure\accessTokens'
      - '.azure/msal_token_cache'
      - 'gcloud\credentials.db'
      - 'gcloud/credentials.db'
      - 'application_default_credentials.json'
      - '.ssh\id_'
      - '.ssh/id_'
      - '.kube\config'
      - '.kube/config'
      - '.docker\config.json'
      - '.docker/config.json'
      - '\Login Data'
      - '/Login Data'
      - 'key4.db'
      - 'logins.json'
      - '.git-credentials'
      - '.netrc'
  selection_reader:
    CommandLine|contains:
      - 'cat '
      - 'type '
      - 'Get-Content'
      - 'gc '
      - 'more '
      - 'cp '
      - 'copy '
      - 'Copy-Item'
      - 'base64'
      - 'curl '
      - 'Invoke-WebRequest'
      - 'scp '
  condition: all of selection_*
falsepositives:
  - A developer explicitly asking the agent to debug cloud CLI or kubeconfig set-up. Confirm with the developer before escalating.
level: high
