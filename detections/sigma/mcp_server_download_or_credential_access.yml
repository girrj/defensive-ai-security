title: MCP Server Process Downloads Payloads or Reads Credential Stores
id: 61104571-29c7-4993-a94c-51642bf03a28
status: experimental
description: |
  Detects a child of an MCP server process that downloads remote content or
  references local credential stores (cloud CLI credentials, SSH keys,
  browser credential databases, .env files). Either is a strong sign of a
  malicious MCP server or an agent being steered into exfiltration through a
  tool. It matches the "tool misuse" and "agentic supply chain" risks in the
  OWASP Top 10 for Agentic Applications.
author: girrj
date: 2026-11-14
tags:
  - attack.command-and-control
  - attack.t1105
  - attack.credential-access
  - attack.t1552.001
  - attack.t1555.003
logsource:
  category: process_creation
detection:
  selection_parent_mcp:
    ParentCommandLine|contains:
      - '@modelcontextprotocol/'
      - 'mcp-server'
      - 'mcp_server'
      - 'server-mcp'
      - '-mcp '
      - 'fastmcp'
      - 'mcp run '
  selection_download:
    CommandLine|contains:
      - 'curl '
      - 'curl.exe'
      - 'wget '
      - 'Invoke-WebRequest'
      - 'iwr '
      - 'Invoke-RestMethod'
      - 'irm '
      - 'DownloadString'
      - 'DownloadFile'
      - 'certutil -urlcache'
      - 'bitsadmin /transfer'
  selection_credentials:
    CommandLine|contains:
      - '.aws/credentials'
      - '.aws\credentials'
      - '.ssh/id_'
      - '.ssh\id_'
      - '.kube/config'
      - '.kube\config'
      - 'application_default_credentials.json'
      - '.git-credentials'
      - '.netrc'
      - '/.env'
      - '\.env'
      - 'Login Data'
      - 'key4.db'
      - 'logins.json'
  condition: selection_parent_mcp and (selection_download or selection_credentials)
falsepositives:
  - Fetch and HTTP MCP servers that shell out to curl by design. Prefer servers that use an in-process HTTP client, and exclude only the exact package.
level: high
