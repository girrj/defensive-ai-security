# =============================================================================
# Blue-team custom WAF rules for ModSecurity (v2.9 / v3) alongside OWASP CRS
# Author:  girrj
# License: MIT
#
# Rule IDs 1009100-1009199 sit in the "local custom" range, clear of CRS.
#
# Load AFTER the CRS setup file and BEFORE the CRS rules, so these targeted
# rules run early. Each rule:
#   - is tagged with ATT&CK and a confidence level,
#   - logs the matched data (truncated) for the SOC,
#   - honors the CRS paranoia/anomaly model where that makes sense, or blocks
#     outright where the pattern has no legitimate use.
#
# Start in DetectionOnly (SecRuleEngine DetectionOnly) for at least a week
# and review the audit log before switching to blocking.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. JNDI lookups (Log4Shell-style), plain and nested-lookup obfuscation.
#    No legitimate request carries "${jndi:", so this rule denies directly.
# -----------------------------------------------------------------------------
SecRule REQUEST_LINE|ARGS|ARGS_NAMES|REQUEST_HEADERS|REQUEST_COOKIES|REQUEST_BODY "@rx (?i)\$\{(?:jndi|\$\{(?:lower|upper|env|::-)[^}]*\})" \
    "id:1009101,\
    phase:2,\
    deny,\
    status:403,\
    t:none,t:urlDecodeUni,t:urlDecodeUni,\
    log,\
    msg:'BLUETEAM JNDI lookup expression in request',\
    logdata:'Matched %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'cve/2021-44228',\
    tag:'mitre/T1190',\
    tag:'confidence/high',\
    severity:'CRITICAL'"

# -----------------------------------------------------------------------------
# 2. Java class-loader manipulation through data binding (Spring4Shell-style).
# -----------------------------------------------------------------------------
SecRule ARGS_NAMES|REQUEST_BODY "@rx (?i)class\.(?:module\.)?classloader" \
    "id:1009102,\
    phase:2,\
    deny,\
    status:403,\
    t:none,t:urlDecodeUni,\
    log,\
    msg:'BLUETEAM Java class-loader manipulation parameter',\
    logdata:'Matched %{MATCHED_VAR_NAME}',\
    tag:'attack-rce',\
    tag:'cve/2022-22965',\
    tag:'mitre/T1190',\
    tag:'confidence/high',\
    severity:'CRITICAL'"

# -----------------------------------------------------------------------------
# 3. Script upload: deny multipart uploads whose file name ends in a server-side
#    script extension. This is the most common way web shells are planted.
#    Exclude specific upload endpoints that really need this (rare).
# -----------------------------------------------------------------------------
SecRule FILES_NAMES|FILES "@rx (?i)\.(?:jspx?|jsw|jsv|jhtml|aspx?|ashx|asmx|asa|cer|cdx|php\d?|phtml|phar|pht|cgi|pl|py|sh)(?:\.|$|;|%00|\x00)" \
    "id:1009103,\
    phase:2,\
    deny,\
    status:403,\
    t:none,t:lowercase,\
    log,\
    msg:'BLUETEAM Server-side script uploaded via multipart form',\
    logdata:'File name: %{MATCHED_VAR}',\
    tag:'attack-webshell',\
    tag:'mitre/T1505.003',\
    tag:'confidence/high',\
    severity:'CRITICAL'"

# -----------------------------------------------------------------------------
# 4. Web shell usage: an OS command passed as a parameter to a script page.
#    Typical one-liner shells take ?cmd=whoami. Anomaly-scored, not denied, so
#    a rare legitimate parameter value doesn't break the application.
# -----------------------------------------------------------------------------
SecRule REQUEST_FILENAME "@rx (?i)\.(?:jspx?|aspx?|ashx|php\d?|phtml)$" \
    "id:1009104,\
    phase:2,\
    pass,\
    t:none,\
    log,\
    msg:'BLUETEAM OS command passed to script page (possible web shell)',\
    logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}',\
    tag:'attack-webshell',\
    tag:'mitre/T1505.003',\
    tag:'confidence/medium',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS "@rx (?i)^(?:cmd(?:\.exe)?\s*/c\s+|powershell(?:\.exe)?\s+|/bin/(?:ba)?sh\s+-c\s+|whoami$|id$|ipconfig|ifconfig|uname\s+-a|net\s+(?:user|localgroup|group)\b|cat\s+/etc/(?:passwd|shadow)|tasklist|systeminfo$)" \
        "t:none,t:urlDecodeUni,t:compressWhitespace,\
        setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# -----------------------------------------------------------------------------
# 5. Path traversal to well-known sensitive files.
# -----------------------------------------------------------------------------
SecRule REQUEST_URI|ARGS "@rx (?i)(?:\.\.[/\x5c]){2,}.*(?:etc[/\x5c](?:passwd|shadow|hosts)|win\.ini|boot\.ini|web\.config|WEB-INF[/\x5c]web\.xml)" \
    "id:1009105,\
    phase:2,\
    deny,\
    status:403,\
    t:none,t:urlDecodeUni,t:urlDecodeUni,t:normalizePathWin,\
    log,\
    msg:'BLUETEAM Path traversal to sensitive file',\
    logdata:'Matched %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-lfi',\
    tag:'mitre/T1190',\
    tag:'confidence/high',\
    severity:'CRITICAL'"

# -----------------------------------------------------------------------------
# 6. Direct access to sensitive artifacts that should never be served.
# -----------------------------------------------------------------------------
SecRule REQUEST_FILENAME "@rx (?i)(?:/\.git/(?:config|HEAD)|/\.env$|/\.svn/|/\.DS_Store$|/WEB-INF/|/META-INF/|\.(?:bak|old|orig|swp|sql|tar|tgz|zip)$)" \
    "id:1009106,\
    phase:1,\
    deny,\
    status:404,\
    t:none,t:urlDecodeUni,t:normalizePath,\
    log,\
    msg:'BLUETEAM Request for sensitive file or backup artifact',\
    logdata:'%{REQUEST_FILENAME}',\
    tag:'attack-disclosure',\
    tag:'mitre/T1595.003',\
    tag:'confidence/high',\
    severity:'WARNING'"

# -----------------------------------------------------------------------------
# 7. Known scanner and exploitation-framework user agents. Logged and scored
#    rather than denied, because blocking on user agent alone is trivially
#    bypassed. The value here is visibility.
# -----------------------------------------------------------------------------
SecRule REQUEST_HEADERS:User-Agent "@pm sqlmap nikto nuclei masscan zgrab gobuster dirbuster feroxbuster wpscan acunetix nessus openvas jaeles" \
    "id:1009107,\
    phase:1,\
    pass,\
    t:none,t:lowercase,\
    log,\
    msg:'BLUETEAM Scanner user agent',\
    logdata:'%{MATCHED_VAR}',\
    tag:'attack-reputation-scanner',\
    tag:'mitre/T1595.002',\
    tag:'confidence/medium',\
    severity:'NOTICE',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.notice_anomaly_score}'"

# -----------------------------------------------------------------------------
# 8. Server-side request forgery to cloud metadata endpoints.
# -----------------------------------------------------------------------------
SecRule ARGS|REQUEST_BODY "@rx (?i)(?:169\.254\.169\.254|metadata\.google\.internal|100\.100\.100\.200|\[?fd00:ec2::254\]?)" \
    "id:1009108,\
    phase:2,\
    deny,\
    status:403,\
    t:none,t:urlDecodeUni,t:lowercase,\
    log,\
    msg:'BLUETEAM Cloud metadata address in request parameter (possible SSRF)',\
    logdata:'Matched %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-ssrf',\
    tag:'mitre/T1552.005',\
    tag:'confidence/high',\
    severity:'CRITICAL'"

# -----------------------------------------------------------------------------
# 9. Response inspection: block responses that leak command output. This
#    catches a web shell that was planted before the WAF rules existed.
#    Requires SecResponseBodyAccess On.
# -----------------------------------------------------------------------------
SecRule RESPONSE_BODY "@rx (?:uid=\d+\([a-z0-9_-]+\)\s+gid=\d+\(|Windows IP Configuration|Directory of [A-Z]:\x5c|root:x:0:0:)" \
    "id:1009109,\
    phase:4,\
    deny,\
    status:500,\
    t:none,\
    log,\
    msg:'BLUETEAM Command output or system file in HTTP response (data leakage)',\
    logdata:'Matched: %{MATCHED_VAR}',\
    tag:'attack-webshell',\
    tag:'attack-disclosure',\
    tag:'mitre/T1505.003',\
    tag:'confidence/high',\
    severity:'CRITICAL'"
